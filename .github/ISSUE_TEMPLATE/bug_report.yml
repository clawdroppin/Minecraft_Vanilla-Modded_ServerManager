name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! The **Health** view and the **Console** usually show what went wrong – please include what they say.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the sidebar (e.g. v1.1.0).
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software and Minecraft version
      placeholder: e.g. Paper 26.3, Fabric 1.21.8 with 40 mods, Cobblemon modpack
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: textarea
    id: logs
    attributes:
      label: Console / log lines
      description: Copy the relevant lines from the Console view (Files & Logs has older logs and crash reports). Remove anything private.
      render: text
